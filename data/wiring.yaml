# wiring diagram
# ESP32 pin assignments match the firmware's pin list (SIGNAL 4, ESC 5, RPWM 10, LPWM 11,
# R_EN 22, L_EN 23, TPS1 2, TPS2 3, I2C SDA 18 / SCL 19). Change the firmware and this file together.

connectors:
  Computer:                 # main computer (T7 + ESP32 both work on Linux)
    type: Main computer
    pinlabels: [USB-A 1, USB-A 2, ETHERNET]
  Power Supply:
    type: Power supply
    pinlabels: [L, N, V1 +5V, V2 +12V, COM]   # ONE supply: V1 = 5 V, V2 = 12 V, COM = common for both. L and N are wall power (not wired here). TODO: connect mains earth (PE) to the chassis. TODO: check V2 current rating covers throttle body motor + relay coils
  Star Ground Point:                    # Star ground point
    type: Ground star point
    # Physical layout on the ground bus (heavy copper / bolted lugs, NOT breadboard pads, for the heavy zone):
    #   HEAVY ZONE (short, thick wires): HBRIDGE GND (motor return), RELAY COIL GND, SERVO GND, SERVO2 GND, PSU COM
    #   QUIET ZONE (joined to the heavy zone at the PSU COM tap): T7 GND, SENS GND, ESP32 GND
    # Motor/servo current then never flows through the sensor tap points.
    pinlabels: [PSU COM, T7 GND, SENS GND, SERVO GND, SERVO2 GND, ESP32 GND, RELAY COIL GND, HBRIDGE GND]   # HBRIDGE GND = high-current motor return (12 V and 5 V both return to PSU COM): short, thick wires. ENGINE TIE = one permanent thin wire to the engine block (optional, battery-independent)
  LM1815 Local Ground Node:                    # local ground node at the LM1815 (screw terminal / copper bus right next to pin 2); ONE wire from here back to the star point
    type: LM1815 local ground node
    pinlabels: [PIN 2, CKP -, C_TIMING, C_PEAK, C_PEAK2, R_PEAK, PIN 9 TIE, PIN 11 TIE, TO STAR]
  Engine Block Ground Bolt:               # engine block ground bolt: the ONLY place the battery - and the kill lead land
    type: Engine block ground bolt
    pinlabels: [BATT -, KILL RETURN, STAR TIE]
  5V Sensor Bus:                    # 5 V sensor bus
    type: 5 V bus
    pinlabels: [IN, P1, P2, P3, P4, LM1815, SUPPLY SENSE, BOSCH TB, HBRIDGE VCC]

  LabJack T7 Pro:
    type: LabJack T7 Pro
    pinlabels: [AIN0, AIN1, AIN2, AIN3, FIO0, FIO1, FIO2, GND, USB, ETHERNET]   # DAQ.py streams AIN0-3 + FIO_STATE (bit 0 = FIO0 = CKP)
  Pressure Sensor Cyl 1: &pt
    type: RIFE pressure transducer (gauge, 0.5-4.5 V)
    pinlabels: [+5V, GND, OUT]   # twist all three wires together
  Pressure Sensor Cyl 2: *pt
  Pressure Sensor Cyl 3: *pt
  Pressure Sensor Cyl 4: *pt

  LM1815 Crank Signal Conditioner:                   # 14-pin DIP/SOIC; referenced below by PIN NUMBER
    type: LM1815 VR amp
    pinlabels: [NC, GND, VIN, NC, MODE (open = adaptive), NC, PEAK DET CAP, VCC, TIMING PULSE IN, GATED OUT (do not use), INPUT SELECT, REF PULSE OUT (open coll.), NC, RC TIMING]
  CKP Input Resistor:                    # input current limit, per the datasheet application circuit (18 kOhm). Mount right at pin 3.
    type: Resistor
    subtype: 18 kOhm
    pinlabels: [CKP side, pin 3 side]
  LM1815 Timing Resistor:                 # pulse = 0.673*R*C = 0.673 x 18k x 15nF = 0.18 ms. Must be > 2 T7 samples (2 x 66.7 us at 15 kHz)
                            # and < the tooth interval (0.33 ms at 15000 RPM x 12 teeth). Anything 15-20 kOhm works.
    type: Resistor
    subtype: 18 kOhm
    pinlabels: [VCC side, pin 14 side]
  LM1815 Timing Capacitor:
    type: Capacitor
    subtype: 15 nF
    pinlabels: [pin 14 side, GND side]
  Peak Detector Capacitor 1:                   # peak-detector capacitor: C_PEAK + C_PEAK2 in parallel = 0.32 uF (datasheet: 0.33 uF)
    type: Capacitor
    subtype: 0.1 uF
    pinlabels: [pin 7 side, GND side]
  Peak Detector Capacitor 2:
    type: Capacitor
    subtype: 0.22 uF
    pinlabels: [pin 7 side, GND side]
  Peak Detector Resistor:                   # peak-detector resistor (datasheet: 1.6 MOhm)
    type: Resistor
    subtype: 1.5 MOhm
    pinlabels: [pin 7 side, GND side]
  5V Monitor Divider Top Resistor:                   # 5 V bus supply monitor for the ESP32 ADC (ADC1 pin, input range ~3.1 V). 1% resistors.
    type: Resistor
    subtype: 10 kOhm (divider top)
    pinlabels: [5V side, mid side]
  5V Monitor Divider Bottom Resistor:
    type: Resistor
    subtype: 10 kOhm (divider bottom)
    pinlabels: [mid side, GND side]
  5V Monitor Filter Capacitor:
    type: Capacitor
    subtype: 100 nF (at the ADC pin)
    pinlabels: [mid side, GND side]
  Throttle Motor Fuse:
    type: Fuse (throttle body motor, TODO rating from the throttle body datasheet)
    pinlabels: [IN, OUT]
  H-Bridge Motor Driver (BTS7960):                  # BTS7960 / IBT-2 module (MTDELE 2-pack on Amazon). 4-pos screw terminal + 8-pin header (RPWM, LPWM, R_EN, L_EN, R_IS, L_IS, VCC, GND). R_IS / L_IS (current sense) left unconnected.
                            # Header VCC = logic supply for the on-board buffer (74HC244 on most IBT-2 boards). TODO: if it is an HC244, its 5 V input-high
                            # threshold (3.5 V) is above the ESP32's 3.3 V; power VCC from 3.3 V instead if the motor responds erratically.
                            # Header GND is usually joined to B- on the board: keep B- the short, thick path.
    type: BTS7960 43A H-bridge module (IBT-2)
    pinlabels: [B+, B-, M+, M-, VCC, GND, RPWM, LPWM, R_EN, L_EN]
  Bosch Electronic Throttle Body:                 # Bosch 32 mm electronic throttle body 0280.750.148 (pin order per Bosch pin layout: 1A Motor-, 2B Poti-, 3C Poti+, 4D Motor+, 5E Poti 2, 6F Poti 1)
                            # TPS1 rises 0->5 V and TPS2 falls 5->0 V as the plate opens; springs park the plate at the limp position when unpowered; opens counterclockwise (~85 deg)
    type: Bosch 32 mm electronic throttle body (6-pin, on the CBR intake)
    pinlabels: [MOTOR-, SENSOR GND, TPS +5V, MOTOR+, TPS2 OUT, TPS1 OUT]
  TPS1 Divider Top Resistor:                  # TPS outputs swing up to ~5 V: divide for the ESP32 ADC (max ~3.1 V). 10k/15k -> 3.0 V max.
    type: Resistor
    subtype: 10 kOhm (TPS1 divider top)
    pinlabels: [TPS side, mid side]
  TPS1 Divider Bottom Resistor:
    type: Resistor
    subtype: 15 kOhm (TPS1 divider bottom)
    pinlabels: [mid side, GND side]
  TPS1 Filter Capacitor:
    type: Capacitor
    subtype: 100 nF (at the ADC pin)
    pinlabels: [mid side, GND side]
  TPS2 Divider Top Resistor:
    type: Resistor
    subtype: 10 kOhm (TPS2 divider top)
    pinlabels: [TPS side, mid side]
  TPS2 Divider Bottom Resistor:
    type: Resistor
    subtype: 15 kOhm (TPS2 divider bottom)
    pinlabels: [mid side, GND side]
  TPS2 Filter Capacitor:
    type: Capacitor
    subtype: 100 nF (at the ADC pin)
    pinlabels: [mid side, GND side]
  Ambient Pressure and Temp Sensor (BMP280):                   # Adafruit BMP280 breakout: ambient pressure + temperature (I2C). Mount away from engine heat, keep leads short.
    type: Adafruit BMP280 (I2C)
    pinlabels: [VIN, 3Vo, GND, SCK, SDO, SDI, CS]     # I2C: SCK=SCL, SDI=SDA; SDO unconnected = 0x77 (to GND = 0x76); CS unconnected (on-board pull-up = I2C mode)
  Crank Position Sensor:
    type: CKP sensor (VR, 2-wire, CBR600RR)
    pinlabels: [+, -]   # +/- is a guess until scoped: swap the two wires if the LM1815 edges land at the wrong point on each tooth
  Crank Signal Pull-up Resistor:                 # pull-up for the LM1815 open-collector output (3.3 V keeps the ESP32-C6 and T7 inputs safe)
                            # NOTE: powered from the ESP32's 3V3, so T7 logging of the CKP needs the ESP32 powered too
    type: Resistor
    subtype: 4.7 kOhm pull-up
    pinlabels: [3V3 side, OUT side]

  ESP32-C6 Controller:
    type: ESP32-C6-DevKitC-1
    pinlabels: [3V3, 5V, GND, GPIO 4 (CKP in), GPIO 5 (throttle servo PWM), GPIO 6 (clutch servo PWM), GPIO 10 (H-bridge RPWM), GPIO 11 (H-bridge LPWM), GPIO 22 (H-bridge R_EN), GPIO 23 (H-bridge L_EN), GPIO 2 (TB TPS1 ADC1), GPIO 3 (TB TPS2 ADC1), GPIO 18 (I2C SDA), GPIO 19 (I2C SCL), GPIO 20 (START button), GPIO 21 (E-STOP sense), GPIO 1 (5V sense ADC1), USB (power + serial)]
    # GPIO 6 (clutch servo), 20 (START), 21 (E-STOP) and 1 (5 V sense) are NOT in the firmware pin list yet: TODO add them to the firmware or remove them here.
    # GPIO 4/5 are also the C6's JTAG / boot-strapping pins: fine as I/O, first suspect if the board ever boots oddly.
  Predator Throttle Servo:
    type: ZOSKAY 25 kg digital servo (Predator throttle)
    pinlabels: [V+, GND, SIGNAL]   # firmware: 50 Hz, 500-2500 us = 0-180 deg; servo goes to 0 deg at every ESP32 boot/reset. Set GUI ANGLE_MAX from the linkage stop.
  Clutch Servo:
    type: RDS51150 digital servo (clutch)    # TODO: check voltage + stall current on its datasheet. TODO: not driven by the current firmware
    pinlabels: [V+, GND, SIGNAL]
  Servo Power Branch:                 # servo supply branch: fuse + bulk capacitor go here. TODO: right voltage per servo datasheets
    type: Servo power branch (separate from sensor 5 V)
    pinlabels: [IN, SERVO V+, SERVO2 V+]
  Start Button:                    # the big button = the engine's START switch. Block with 2 NO contacts, both close together while held:
                            #   STARTER A/B is in the starter solenoid trigger circuit (battery + -> solenoid), so holding it cranks the engine
                            #   SENSE A/B goes to the ESP32 (INPUT_PULLUP, pressed = LOW) so the software can see/log the crank (it cannot stop it)
    type: START pushbutton (2 NO contacts, momentary)
    pinlabels: [STARTER A, STARTER B, SENSE A, SENSE B]
  Starter Battery:                     # starter battery from the Predator manual: 12 V lead-acid, 300 CCA, 36 Ah (not included with the engine)
    type: 12 V starter battery (300 CCA, 36 Ah)
    pinlabels: [+, -]
  Starter Trigger Fuse:               # protects the solenoid trigger wiring, placed as close to the battery + as possible. TODO: rating (solenoid coil is small, a few A)
    type: Fuse (starter solenoid trigger)
    pinlabels: [IN, OUT]
  Starter Solenoid:              # the engine's starter solenoid. Manual: battery + cable goes on the uncovered terminal; trigger terminal is what the engine switch START position feeds
    type: Predator starter solenoid
    pinlabels: [BATT POS (big terminal), TRIGGER]
  Emergency Stop Button:                    # mushroom E-stop button: ONE NC contact in the relay-coil loop + ONE NO contact for the ESP32 sense input
    type: E-STOP button (1 NC + 1 NO contact block)
    pinlabels: [NC A, NC B, SENSE A, SENSE B]
  Key Switch:                      # key switch in the same loop: no key = nothing powered
    type: Key switch (SPST)
    pinlabels: [A, B]
  Emergency Stop Relay Bank:                   # energized = RUN. Any break in the loop (E-stop, key, 12 V loss) drops them all. TODO: rate each contact for its load, or use a contactor
    type: E-stop relay bank (coil + 3 NO contacts + 1 NC contact)
    pinlabels: [COIL+, COIL-, NO1 A, NO1 B, NO2 A, NO2 B, NC3 A, NC3 B, NO4 A, NO4 B]   # NO4 = starter solenoid trigger gate
  Predator Ignition Kill Lead:                # the Predator's ignition kill lead (grounding it stops the engine)
    type: Predator ignition kill lead
    pinlabels: [KILL LEAD]

cables:
  Wire - 12V to Key Switch: {wirecount: 1}
  Wire - Key Switch to E-Stop: {wirecount: 1}
  Wire - E-Stop to Relay Coil: {wirecount: 1}
  Wire - Relay Coil Ground: {wirecount: 1}
  Wires - Predator Kill Circuit: {wirecount: 2}        # wire 2 goes DIRECT to the engine block bolt, never through the star point or electronics
  Wire - 12V to Throttle Relay Contact: {wirecount: 1}
  Wire - Relay to Throttle Fuse: {wirecount: 1}
  Wire - Fuse to H-Bridge Power: {wirecount: 1}
  Wire - H-Bridge Power Ground (heavy): {wirecount: 1}      # thick + short: throttle motor return from the module B- to the star point
  Wires - H-Bridge to Throttle Motor: {wirecount: 2}
  Wires - H-Bridge PWM Signals: {wirecount: 2}     # RPWM / LPWM (4-pin Dupont housing with W_HB_EN on the IBT-2 header)
  Wire - H-Bridge Logic Power: {wirecount: 1}      # logic supply for the module (5 V bus, or 3.3 V - see HBRIDGE note)
  Wire - H-Bridge Logic Ground: {wirecount: 1}      # logic ground to the ESP32 (signal reference only)
  Wires - H-Bridge Enable Signals: {wirecount: 2}       # R_EN / L_EN from ESP32 GPIOs so stopAll() / fault() can actually cut the motor (NOT tied to 5 V)
  Wire - Throttle Sensor 5V: {wirecount: 1}
  Wire - Throttle Sensor Ground: {wirecount: 1}
  Wire - TPS1 Signal: {wirecount: 1}
  Wires - TPS1 Divider to ESP32-C6 Controller: {wirecount: 3}
  Wires - TPS1 Divider Ground: {wirecount: 2}
  Wire - TPS2 Signal: {wirecount: 1}
  Wires - TPS2 Divider to ESP32-C6 Controller: {wirecount: 3}
  Wires - TPS2 Divider Ground: {wirecount: 2}
  Wires - Ambient Sensor I2C and Power: {wirecount: 4}
  Wire - 5V Monitor Feed: {wirecount: 1}
  Wires - 5V Monitor to ESP32-C6 Controller: {wirecount: 3}
  Wires - 5V Monitor Ground: {wirecount: 2}
  USB Cable - ESP32-C6 Controller: {wirecount: 1}
  USB Cable - LabJack: {wirecount: 1}
  Ethernet Cable - LabJack: {wirecount: 1}
  Wire - 5V Supply to Sensor Bus: {wirecount: 1}
  Wire - Supply Common to Star Ground (heavy): {wirecount: 1}     # HEAVY + SHORT: carries ALL the return to PSU COM: 5 V (sensors, T7, ESP32, servos) AND 12 V (throttle motor, relay coils). Size for the stall current of the throttle motor plus servos
  Wire - LabJack Ground: {wirecount: 1}
  Wire - ESP32 Ground: {wirecount: 1}
  Wire - Throttle Servo Ground (heavy): {wirecount: 1}   # thick + short: servo return current
  Wires - LM1815 Power and Ground: {wirecount: 2}
  Wires - LM1815 Timing Resistor: {wirecount: 2}
  Wires - LM1815 Timing Capacitor: {wirecount: 2}
  Wires - Peak Capacitor 1: {wirecount: 2}
  Wire - LM1815 Pin 9 Tie: {wirecount: 1}
  Wire - LM1815 Pin 11 Tie: {wirecount: 1}
  Twisted Pair - Crank Sensor: {wirecount: 2}          # twisted pair (shielded if possible, shield to LMGND only), stranded, engine-rated insulation (TXL/GXL)
  Wire - Input Resistor to LM1815: {wirecount: 1}         # R_VIN to pin 3: keep it short
  Wires - Crank Pulse Output: {wirecount: 2}
  Wires - Crank Pull-up Resistor: {wirecount: 2}
  Wires - Throttle Servo Power and Signal: {wirecount: 2}
  Wire - Clutch Servo Signal: {wirecount: 1}
  Wires - Servo Power Branch: {wirecount: 3}
  Wire - Clutch Servo Ground (heavy): {wirecount: 1}  # thick + short: servo return current
  Wires - Peak Capacitor 2: {wirecount: 2}
  Wires - Peak Resistor: {wirecount: 2}
  Wires - Start Button Sense: {wirecount: 2}
  Wire - Battery to Starter Fuse: {wirecount: 1}
  Wire - Starter Fuse to Relay: {wirecount: 1}
  Wire - Relay to Start Button: {wirecount: 1}
  Wire - Start Button to Solenoid: {wirecount: 1}
  Cable - Battery to Solenoid (heavy): {wirecount: 1}    # heavy battery + cable to the solenoid big terminal (gauge/length per the manual's chart)
  Cable - Battery Negative to Engine Block (heavy): {wirecount: 1}    # heavy battery - cable to an engine mounting bolt (battery is only connected for starts: connect - first, + last)
  Wire - LM1815 Ground Node to Star: {wirecount: 1}      # the single wire from the LM1815 local ground node back to the star point
  Wires - E-Stop Sense: {wirecount: 2}
  Cable - Pressure Sensor Cyl 1: {wirecount: 3, colors: [RD, BK, WH]}
  Cable - Pressure Sensor Cyl 2: {wirecount: 3, colors: [RD, BK, WH]}
  Cable - Pressure Sensor Cyl 3: {wirecount: 3, colors: [RD, BK, WH]}
  Cable - Pressure Sensor Cyl 4: {wirecount: 3, colors: [RD, BK, WH]}

connections:
  - [Power Supply: [V1 +5V], Wire - 5V Supply to Sensor Bus: [1], 5V Sensor Bus: [IN]]
  - [Power Supply: [COM], Wire - Supply Common to Star Ground (heavy): [1], Star Ground Point: [PSU COM]]
  - [Star Ground Point: [T7 GND], Wire - LabJack Ground: [1], LabJack T7 Pro: [GND]]
  - [Star Ground Point: [ESP32 GND], Wire - ESP32 Ground: [1], ESP32-C6 Controller: [GND]]
  - [Star Ground Point: [SERVO GND], Wire - Throttle Servo Ground (heavy): [1], Predator Throttle Servo: [GND]]
  # ---- in-cylinder pressure transducers -> T7 (single-ended; switch to differential pairs if ground noise shows up) ----
  - [5V Sensor Bus: [P1], Cable - Pressure Sensor Cyl 1: [1], Pressure Sensor Cyl 1: [+5V]]
  - [Star Ground Point: [SENS GND], Cable - Pressure Sensor Cyl 1: [2], Pressure Sensor Cyl 1: [GND]]
  - [Pressure Sensor Cyl 1: [OUT], Cable - Pressure Sensor Cyl 1: [3], LabJack T7 Pro: [AIN0]]
  - [5V Sensor Bus: [P2], Cable - Pressure Sensor Cyl 2: [1], Pressure Sensor Cyl 2: [+5V]]
  - [Star Ground Point: [SENS GND], Cable - Pressure Sensor Cyl 2: [2], Pressure Sensor Cyl 2: [GND]]
  - [Pressure Sensor Cyl 2: [OUT], Cable - Pressure Sensor Cyl 2: [3], LabJack T7 Pro: [AIN1]]
  - [5V Sensor Bus: [P3], Cable - Pressure Sensor Cyl 3: [1], Pressure Sensor Cyl 3: [+5V]]
  - [Star Ground Point: [SENS GND], Cable - Pressure Sensor Cyl 3: [2], Pressure Sensor Cyl 3: [GND]]
  - [Pressure Sensor Cyl 3: [OUT], Cable - Pressure Sensor Cyl 3: [3], LabJack T7 Pro: [AIN2]]
  - [5V Sensor Bus: [P4], Cable - Pressure Sensor Cyl 4: [1], Pressure Sensor Cyl 4: [+5V]]
  - [Star Ground Point: [SENS GND], Cable - Pressure Sensor Cyl 4: [2], Pressure Sensor Cyl 4: [GND]]
  - [Pressure Sensor Cyl 4: [OUT], Cable - Pressure Sensor Cyl 4: [3], LabJack T7 Pro: [AIN3]]
  # ---- LM1815 (pin numbers): power, CKP input, timing, peak detector ----
  - [5V Sensor Bus: [LM1815], Wires - LM1815 Power and Ground: [1], LM1815 Crank Signal Conditioner: [8]]          # pin 8 VCC
  - [LM1815 Local Ground Node: [PIN 2], Wires - LM1815 Power and Ground: [2], LM1815 Crank Signal Conditioner: [2]]           # pin 2 GND (local ground node, right at the chip)
  - [Crank Position Sensor: [+], Twisted Pair - Crank Sensor: [1], CKP Input Resistor: [1]]                  # CKP + -> 18k series resistor ...
  - [CKP Input Resistor: [2], Wire - Input Resistor to LM1815: [1], LM1815 Crank Signal Conditioner: [3]]              # ... -> pin 3 VIN
  - [Crank Position Sensor: [-], Twisted Pair - Crank Sensor: [2], LM1815 Local Ground Node: [CKP -]]              # CKP - -> local ground node (ground-referenced input; no ECU on this sensor)
  - [LM1815 Crank Signal Conditioner: [8], Wires - LM1815 Timing Resistor: [1], LM1815 Timing Resistor: [1]]            # RC timing: R from VCC to pin 14 ...
  - [LM1815 Timing Resistor: [2], Wires - LM1815 Timing Resistor: [2], LM1815 Crank Signal Conditioner: [14]]
  - [LM1815 Crank Signal Conditioner: [14], Wires - LM1815 Timing Capacitor: [1], LM1815 Timing Capacitor: [1]]           # ... C from pin 14 to GND
  - [LM1815 Timing Capacitor: [2], Wires - LM1815 Timing Capacitor: [2], LM1815 Local Ground Node: [C_TIMING]]
  - [LM1815 Crank Signal Conditioner: [7], Wires - Peak Capacitor 1: [1], Peak Detector Capacitor 1: [1]]              # peak detector capacitors + resistor to GND
  - [Peak Detector Capacitor 1: [2], Wires - Peak Capacitor 1: [2], LM1815 Local Ground Node: [C_PEAK]]
  - [LM1815 Crank Signal Conditioner: [7], Wires - Peak Capacitor 2: [1], Peak Detector Capacitor 2: [1]]
  - [Peak Detector Capacitor 2: [2], Wires - Peak Capacitor 2: [2], LM1815 Local Ground Node: [C_PEAK2]]
  - [LM1815 Crank Signal Conditioner: [7], Wires - Peak Resistor: [1], Peak Detector Resistor: [1]]
  - [Peak Detector Resistor: [2], Wires - Peak Resistor: [2], LM1815 Local Ground Node: [R_PEAK]]
  - [LM1815 Crank Signal Conditioner: [9], Wire - LM1815 Pin 9 Tie: [1], LM1815 Local Ground Node: [PIN 9 TIE]]     # unused logic inputs tied low
  - [LM1815 Crank Signal Conditioner: [11], Wire - LM1815 Pin 11 Tie: [1], LM1815 Local Ground Node: [PIN 11 TIE]]
  - [LM1815 Local Ground Node: [TO STAR], Wire - LM1815 Ground Node to Star: [1], Star Ground Point: [SENS GND]]   # one wire from the local node to the star
  # ---- CKP pulse output: pin 12 (open collector, LOW during each tooth pulse) -> T7 FIO0 + ESP32 GPIO 4, pulled up to 3.3 V ----
  - [LM1815 Crank Signal Conditioner: [12], Wires - Crank Pulse Output: [1], LabJack T7 Pro: [FIO0]]
  - [LM1815 Crank Signal Conditioner: [12], Wires - Crank Pulse Output: [2], ESP32-C6 Controller: [GPIO 4 (CKP in)]]
  - [ESP32-C6 Controller: [3V3], Wires - Crank Pull-up Resistor: [1], Crank Signal Pull-up Resistor: [3V3 side]]
  - [Crank Signal Pull-up Resistor: [OUT side], Wires - Crank Pull-up Resistor: [2], LM1815 Crank Signal Conditioner: [12]]
  # ---- servos: power goes through the E-STOP, then the servo branch ----
  - [Power Supply: [V1 +5V], Wires - Servo Power Branch: [1], Emergency Stop Relay Bank: [NO1 A]]    # TODO: placeholder source; servos probably need a different voltage/more current
  - [Emergency Stop Relay Bank: [NO1 B], Wires - Servo Power Branch: [2], Servo Power Branch: [IN]]
  - [Servo Power Branch: [SERVO V+], Wires - Throttle Servo Power and Signal: [1], Predator Throttle Servo: [V+]]
  - [Servo Power Branch: [SERVO2 V+], Wires - Servo Power Branch: [3], Clutch Servo: [V+]]
  - [Star Ground Point: [SERVO2 GND], Wire - Clutch Servo Ground (heavy): [1], Clutch Servo: [GND]]
  - [ESP32-C6 Controller: [GPIO 5 (throttle servo PWM)], Wires - Throttle Servo Power and Signal: [2], Predator Throttle Servo: [SIGNAL]]
  - [ESP32-C6 Controller: [GPIO 6 (clutch servo PWM)], Wire - Clutch Servo Signal: [1], Clutch Servo: [SIGNAL]]   # TODO: pin not in firmware yet
  # ---- START button sense and E-STOP sense (ESP32 uses INPUT_PULLUP, so a closed contact reads LOW). TODO: add to firmware ----
  - [Start Button: [SENSE A], Wires - Start Button Sense: [1], ESP32-C6 Controller: [GPIO 20 (START button)]]
  - [Start Button: [SENSE B], Wires - Start Button Sense: [2], ESP32-C6 Controller: [GND]]
  # ---- engine start: battery + -> fuse -> relay NO4 (dies on E-stop) -> START button -> solenoid trigger. Release the button = crank stops ----
  # Manual limits: crank 5 s max, then wait 1 min. Nothing here enforces that (it is the operator's hand on the button).
  - [Starter Battery: [+], Wire - Battery to Starter Fuse: [1], Starter Trigger Fuse: [IN]]
  - [Starter Trigger Fuse: [OUT], Wire - Starter Fuse to Relay: [1], Emergency Stop Relay Bank: [NO4 A]]
  - [Emergency Stop Relay Bank: [NO4 B], Wire - Relay to Start Button: [1], Start Button: [STARTER A]]
  - [Start Button: [STARTER B], Wire - Start Button to Solenoid: [1], Starter Solenoid: [TRIGGER]]
  - [Starter Battery: [+], Cable - Battery to Solenoid (heavy): [1], Starter Solenoid: [BATT POS (big terminal)]]
  # Battery - to the engine mounting bolt (cranking current returns through the engine block, NOT through the star point).
  # The battery is only connected for starts. Its - goes ONLY to the engine block bolt, never to the star point.
  - [Starter Battery: [-], Cable - Battery Negative to Engine Block (heavy): [1], Engine Block Ground Bolt: [BATT -]]
  - [Emergency Stop Button: [SENSE A], Wires - E-Stop Sense: [1], ESP32-C6 Controller: [GPIO 21 (E-STOP sense)]]
  - [Emergency Stop Button: [SENSE B], Wires - E-Stop Sense: [2], ESP32-C6 Controller: [GND]]
  # ---- main computer ----
  - [Computer: [USB-A 1], USB Cable - ESP32-C6 Controller: [1], ESP32-C6 Controller: [USB (power + serial)]]   # also powers the ESP32 (so no 5 V bus link). NOTE: ESP32 and T7 both ground to the computer via USB AND via the star = ground loop; if the pressure readings are noisy, put a USB isolator on the ESP32
