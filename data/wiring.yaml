# wiring diagram 

connectors:
  COMPUTER:                 # main computer (T7 + ESP32 both work on Linux)
    type: Main computer
    pinlabels: [USB-A 1, USB-A 2, ETHERNET]
  PSU:
    type: Power supply
    pinlabels: [L, N, V1 +5V, V2 +12V, COM]   # ONE supply: V1 = 5 V, V2 = 12 V, COM = common for both. L and N are wall power (not wired here). TODO: connect mains earth (PE) to the chassis. TODO: check V2 current rating covers throttle body motor + relay coils
  GNDPT:                    # Star ground point
    type: Ground star point
    # Physical layout on the ground bus (heavy copper / bolted lugs, NOT breadboard pads, for the heavy zone):
    #   HEAVY ZONE (short, thick wires): HBRIDGE GND (motor return), RELAY COIL GND, SERVO GND, SERVO2 GND, PSU COM
    #   QUIET ZONE (joined to the heavy zone at the PSU COM tap): T7 GND, SENS GND, ESP32 GND
    # Motor/servo current then never flows through the sensor tap points.
    pinlabels: [PSU COM, T7 GND, SENS GND, SERVO GND, SERVO2 GND, ESP32 GND, RELAY COIL GND, HBRIDGE GND]   # HBRIDGE GND = high-current motor return (12 V and 5 V both return to PSU COM): short, thick wires. ENGINE TIE = one permanent thin wire to the engine block (optional, battery-independent)
  LMGND:                    # local ground node at the LM1815 (copper bus right next to pin 2); ONE wire from here back to the star point
    type: LM1815 local ground node
    pinlabels: [PIN 2, C_TIMING, C_PEAK, C_PEAK2, R_PEAK, PIN 9 TIE, PIN 11 TIE, TO STAR]
  ENGINE_BLK:               # engine block ground bolt: the ONLY place the battery - and the kill lead land
    type: Engine block ground bolt
    pinlabels: [BATT -, KILL RETURN, STAR TIE]
  BUS5V:                    # 5 V sensor bus
    type: 5 V bus
    pinlabels: [IN, P1, P2, P3, P4, LM1815, SUPPLY SENSE, BOSCH TB, HBRIDGE VCC]

  T7:
    type: LabJack T7 Pro
    pinlabels: [AIN0, AIN1, AIN2, AIN3, FIO0, FIO1, FIO2, GND, USB, ETHERNET]
  P1: &pt
    type: RIFE pressure transducer
    pinlabels: [+5V, GND, OUT]
  P2: *pt
  P3: *pt
  P4: *pt

  LM1815:                   # 14-pin DIP/SOIC; referenced below by PIN NUMBER 
    type: LM1815 VR amp
    pinlabels: [NC, GND, VIN, NC, MODE (open = adaptive), NC, PEAK DET CAP, VCC, TIMING PULSE IN, GATED OUT (do not use), INPUT SELECT, REF PULSE OUT (open coll.), NC, RC TIMING]
  R_TIMING:                 # pulse = 0.673*R*C. NOTE 100k x 15nF = 1.0 ms, LONGER than the 0.83 ms tooth interval at 6000 RPM x 12 teeth (teeth get swallowed). Aim for ~0.3-0.4 ms.
    type: Resistor
    subtype: 100 kOhm
    pinlabels: [VCC side, pin 14 side]
  C_TIMING:
    type: Capacitor
    subtype: 15 nF
    pinlabels: [pin 14 side, GND side]
  C_PEAK:                   # peak-detector capacitor. 
    type: Capacitor
    subtype: 0.1 uF
    pinlabels: [pin 7 side, GND side]
  C_PEAK2:                   # peak-detector capacitor. 
    type: Capacitor
    subtype: 0.22 uF
    pinlabels: [pin 7 side, GND side]
  R_PEAK:                   # peak-detector resistor
    type: Resistor 
    subtype: 1.5 MOhm 
    pinlabels: [pin 7 side, GND side]
  R_DIV1:                   # 5 V bus supply monitor for the ESP32 ADC (ADC1 pin, input range ~3.1 V). 1% resistors.
    type: Resistor
    subtype: 10 kOhm (divider top)
    pinlabels: [5V side, mid side]
  R_DIV2:
    type: Resistor
    subtype: 10 kOhm (divider bottom)
    pinlabels: [mid side, GND side]
  C_ADC:
    type: Capacitor
    subtype: 100 nF (at the ADC pin)
    pinlabels: [mid side, GND side]
  TB_FUSE:
    type: Fuse (throttle body motor, TODO rating from the throttle body datasheet)
    pinlabels: [IN, OUT]
  HBRIDGE:                  # BTS7960 / IBT-2 module (MTDELE 2-pack on Amazon). 4-pos screw terminal + 8-pin header. Header pins R_IS / L_IS (current sense) left unconnected.
    type: BTS7960 43A H-bridge module (IBT-2)
    pinlabels: [B+, B-, M+, M-, VCC, GND, RPWM, LPWM, R_EN, L_EN]
  BOSCH_TB:                 # Bosch 32 mm electronic throttle body (pin order per Bosch pin layout / Haltech sheet; VERIFY with a meter)
    type: Bosch 32 mm electronic throttle body (6-pin, on the CBR intake)
    pinlabels: [MOTOR-, SENSOR GND, TPS +5V, MOTOR+, TPS2 OUT, TPS1 OUT]
  R_TPS1A:                  # TPS outputs swing up to ~5 V: divide for the ESP32 ADC (max ~3.1 V)
    type: Resistor
    subtype: 10 kOhm (TPS1 divider top)
    pinlabels: [TPS side, mid side]
  R_TPS1B:
    type: Resistor
    subtype: 15 kOhm (TPS1 divider bottom)
    pinlabels: [mid side, GND side]
  C_TPS1:
    type: Capacitor
    subtype: 100 nF (at the ADC pin)
    pinlabels: [mid side, GND side]
  R_TPS2A:
    type: Resistor
    subtype: 10 kOhm (TPS2 divider top)
    pinlabels: [TPS side, mid side]
  R_TPS2B:
    type: Resistor
    subtype: 15 kOhm (TPS2 divider bottom)
    pinlabels: [mid side, GND side]
  C_TPS2:
    type: Capacitor
    subtype: 100 nF (at the ADC pin)
    pinlabels: [mid side, GND side]
  BMP280:                   # Adafruit BMP280 breakout: ambient pressure + temperature (I2C). Mount away from engine heat, keep leads short.
    type: Adafruit BMP280 (I2C)
    pinlabels: [VIN, 3Vo, GND, SCK, SDO, SDI, CS]     # I2C: SCK=SCL, SDI=SDA; SDO unconnected = 0x77 (to GND = 0x76); CS unconnected
  CKP:
    type: CKP sensor (VR)
    pinlabels: [+, -]
  R_PULLUP:                 # <- resistor value goes in type/subtype
    type: Resistor
    subtype: 4.7 kOhm pull-up
    pinlabels: [3V3 side, OUT side]

  ESP32:
    type: ESP32-C6-DevKitC-1
    pinlabels: [3V3, 5V, GND, GPIO 10 (CKP in), GPIO 18 (throttle servo PWM), GPIO 19 (clutch servo PWM), GPIO 20 (START button), GPIO 21 (E-STOP sense), GPIO 1 (5V sense ADC1), GPIO 6 (I2C SDA), GPIO 7 (I2C SCL), GPIO 22 (TB H-bridge IN1), GPIO 23 (TB H-bridge IN2), GPIO 2 (TB TPS1 ADC1), GPIO 3 (TB TPS2 ADC1), USB (power + serial)]
  SERVO:
    type: ZOSKAY 25 kg digital servo (throttle)
    pinlabels: [V+, GND, SIGNAL]
  SERVO2:
    type: RDS51150 digital servo (clutch)    # TODO: check voltage + stall current on its datasheet
    pinlabels: [V+, GND, SIGNAL]
  SERVOPWR:                 # servo supply branch: fuse + bulk capacitor go here. TODO: right voltage per servo datasheets
    type: Servo power branch (separate from sensor 5 V)
    pinlabels: [IN, SERVO V+, SERVO2 V+]
  START:                    # the big button = the engine's START switch. Block with 2 NO contacts, both close together while held:
                            #   STARTER A/B is in the starter solenoid trigger circuit (battery + -> solenoid), so holding it cranks the engine
                            #   SENSE A/B goes to the ESP32 (INPUT_PULLUP, pressed = LOW) so the software can see/log the crank (it cannot stop it)
    type: START pushbutton (2 NO contacts, momentary)
    pinlabels: [STARTER A, STARTER B, SENSE A, SENSE B]
  BATT:                     # starter battery from the Predator manual: 12 V lead-acid, 300 CCA, 36 Ah (not included with the engine)
    type: 12 V starter battery (300 CCA, 36 Ah)
    pinlabels: [+, -]
  START_FUSE:               # protects the solenoid trigger wiring, placed as close to the battery + as possible. TODO: rating (solenoid coil is small, a few A)
    type: Fuse (starter solenoid trigger)
    pinlabels: [IN, OUT]
  STARTER_SOL:              # the engine's starter solenoid. Manual: battery + cable goes on the uncovered terminal; trigger terminal is what the engine switch START position feeds
    type: Predator starter solenoid
    pinlabels: [BATT POS (big terminal), TRIGGER]
  ESTOP:                    # mushroom E-stop button: ONE NC contact in the relay-coil loop + ONE NO contact for the ESP32 sense input
    type: E-STOP button (1 NC + 1 NO contact block)
    pinlabels: [NC A, NC B, SENSE A, SENSE B]
  KEY:                      # key switch in the same loop: no key = nothing powered
    type: Key switch (SPST)
    pinlabels: [A, B]
  RELAYS:                   # energized = RUN. Any break in the loop (E-stop, key, 12 V loss) drops them all. TODO: rate each contact for its load, or use a contactor
    type: E-stop relay bank (coil + 3 NO contacts + 1 NC contact)
    pinlabels: [COIL+, COIL-, NO1 A, NO1 B, NO2 A, NO2 B, NC3 A, NC3 B, NO4 A, NO4 B]   # NO4 = starter solenoid trigger gate (added)
  PRED_KILL:                # the Predator's ignition kill lead (grounding it stops the engine)
    type: Predator ignition kill lead
    pinlabels: [KILL LEAD]

cables:
  W_COIL_A: {wirecount: 1}
  W_COIL_B: {wirecount: 1}
  W_COIL_C: {wirecount: 1}
  W_COIL_GND: {wirecount: 1}
  W_KILL: {wirecount: 2}        # wire 2 goes DIRECT to the engine block bolt, never through the star point or electronics
  W_12V_ESTOP: {wirecount: 1}
  W_12V_FUSE: {wirecount: 1}
  W_12V_HB: {wirecount: 1}
  W_GND_HB: {wirecount: 1}      # thick + short: throttle motor return from the module B- to the star point
  W_HB_MOT: {wirecount: 2}
  W_HB_CTRL: {wirecount: 2}
  W_HB_VCC: {wirecount: 1}      # logic supply for the module (5 V bus)
  W_HB_GND: {wirecount: 1}      # logic ground to the ESP32 (signal reference only)
  W_HB_EN: {wirecount: 2}       # R_EN and L_EN tied to VCC (enabled). TODO: the sketch drives R_EN/L_EN from GPIOs; assign 2 free ESP32 pins if you want software enable
  W_TB_5V: {wirecount: 1}
  W_TB_SGND: {wirecount: 1}
  W_TPS1_SIG: {wirecount: 1}
  W_TPS1_NODE: {wirecount: 3}
  W_TPS1_GND: {wirecount: 2}
  W_TPS2_SIG: {wirecount: 1}
  W_TPS2_NODE: {wirecount: 3}
  W_TPS2_GND: {wirecount: 2}
  W_BMP: {wirecount: 4}
  W_DIV_TOP: {wirecount: 1}
  W_DIV_MID: {wirecount: 3}
  W_DIV_GND: {wirecount: 2}
  W_USB_ESP: {wirecount: 1}
  W_USB_T7: {wirecount: 1}
  W_ETH_T7: {wirecount: 1}
  W_PWR: {wirecount: 1}
  W_GND_PSU: {wirecount: 1}     # HEAVY + SHORT: carries ALL the return to PSU COM: 5 V (sensors, T7, ESP32, servos) AND 12 V (throttle motor, relay coils). Size for the stall current of the throttle motor plus servos
  W_GND_T7: {wirecount: 1}
  W_GND_ESP: {wirecount: 1}
  W_GND_SERVO: {wirecount: 1}   # thick + short: servo return current
  W_LM: {wirecount: 2}
  W_RT: {wirecount: 2}
  W_CT: {wirecount: 2}
  W_CP: {wirecount: 2}
  W_TIE9: {wirecount: 1}
  W_TIE11: {wirecount: 1}
  W_VR: {wirecount: 2}
  W_CKP_OUT: {wirecount: 2}
  W_PU: {wirecount: 2}
  W_SERVO: {wirecount: 2}
  W_SERVO2: {wirecount: 1}
  W_SPWR: {wirecount: 3}
  W_GND_SERVO2: {wirecount: 1}  # thick + short: servo return current
  W_CP2: {wirecount: 2}
  W_RP: {wirecount: 2}
  W_START: {wirecount: 2}
  W_BATT_FUSE: {wirecount: 1}
  W_START_GATE: {wirecount: 1}
  W_START_SW: {wirecount: 1}
  W_START_SOL: {wirecount: 1}
  W_BATT_SOL: {wirecount: 1}    # heavy battery + cable to the solenoid big terminal (gauge/length per the manual's chart)
  W_BATT_NEG: {wirecount: 1}    # heavy battery - cable to an engine mounting bolt (battery is only connected for starts: connect - first, + last)
  W_GND_LM: {wirecount: 1}      # the single wire from the LM1815 local ground node back to the star point
  W_ESTOP: {wirecount: 2}
  W_P1: {wirecount: 3, colors: [RD, BK, WH]}
  W_P2: {wirecount: 3, colors: [RD, BK, WH]}
  W_P3: {wirecount: 3, colors: [RD, BK, WH]}
  W_P4: {wirecount: 3, colors: [RD, BK, WH]}

connections:
  - [PSU: [V1 +5V], W_PWR: [1], BUS5V: [IN]]
  - [PSU: [COM], W_GND_PSU: [1], GNDPT: [PSU COM]]
  - [GNDPT: [T7 GND], W_GND_T7: [1], T7: [GND]]
  - [GNDPT: [ESP32 GND], W_GND_ESP: [1], ESP32: [GND]]
  - [GNDPT: [SERVO GND], W_GND_SERVO: [1], SERVO: [GND]]
  - [BUS5V: [P1], W_P1: [1], P1: [+5V]]
  - [GNDPT: [SENS GND], W_P1: [2], P1: [GND]]
  - [P1: [OUT], W_P1: [3], T7: [AIN0]]
  - [BUS5V: [P2], W_P2: [1], P2: [+5V]]
  - [GNDPT: [SENS GND], W_P2: [2], P2: [GND]]
  - [P2: [OUT], W_P2: [3], T7: [AIN1]]
  - [BUS5V: [P3], W_P3: [1], P3: [+5V]]
  - [GNDPT: [SENS GND], W_P3: [2], P3: [GND]]
  - [P3: [OUT], W_P3: [3], T7: [AIN2]]
  - [BUS5V: [P4], W_P4: [1], P4: [+5V]]
  - [GNDPT: [SENS GND], W_P4: [2], P4: [GND]]
  - [P4: [OUT], W_P4: [3], T7: [AIN3]]
  # ---- LM1815 (pin numbers): power, CKP input, timing, peak detector ----
  - [BUS5V: [LM1815], W_LM: [1], LM1815: [8]]          # pin 8 VCC
  - [LMGND: [PIN 2], W_LM: [2], LM1815: [2]]           # pin 2 GND (local ground node, right at the chip)
  - [CKP: [+], W_VR: [1], LM1815: [3]]                 # pin 3 VIN
  - [CKP: [-], W_VR: [2], LM1815: [2]]                 # CKP minus -> pin 2 GND (ground-referenced input)
  - [LM1815: [8], W_RT: [1], R_TIMING: [1]]            # RC timing: R from VCC to pin 14 ...
  - [R_TIMING: [2], W_RT: [2], LM1815: [14]]
  - [LM1815: [14], W_CT: [1], C_TIMING: [1]]           # ... C from pin 14 to GND
  - [C_TIMING: [2], W_CT: [2], LMGND: [C_TIMING]]
  - [LM1815: [7], W_CP: [1], C_PEAK: [1]]              # peak detector capacitor to GND
  - [C_PEAK: [2], W_CP: [2], LMGND: [C_PEAK]]
  - [LM1815: [7], W_CP2: [1], C_PEAK2: [1]]            # second peak detector capacitor to GND
  - [C_PEAK2: [2], W_CP2: [2], LMGND: [C_PEAK2]]
  - [LM1815: [7], W_RP: [1], R_PEAK: [1]]              # peak detector resistor to GND
  - [R_PEAK: [2], W_RP: [2], LMGND: [R_PEAK]]
  - [LM1815: [9], W_TIE9: [1], LMGND: [PIN 9 TIE]]     # unused logic inputs tied low
  - [LM1815: [11], W_TIE11: [1], LMGND: [PIN 11 TIE]]
  - [LMGND: [TO STAR], W_GND_LM: [1], GNDPT: [SENS GND]]   # one wire from the local node to the star (keep CKP wiring a twisted pair)
  # ---- CKP pulse output: pin 12 (open collector) -> T7 FIO2 + ESP32, pulled up to 3.3 V ----
  - [LM1815: [12], W_CKP_OUT: [1], T7: [FIO2]]
  - [LM1815: [12], W_CKP_OUT: [2], ESP32: [GPIO 10 (CKP in)]]
  - [ESP32: [3V3], W_PU: [1], R_PULLUP: [3V3 side]]
  - [R_PULLUP: [OUT side], W_PU: [2], LM1815: [12]]
  # ---- servos: power goes through the E-STOP, then the servo branch ----
  - [PSU: [V1 +5V], W_SPWR: [1], RELAYS: [NO1 A]]    # TODO: placeholder source; servos probably need a different voltage/more current
  - [RELAYS: [NO1 B], W_SPWR: [2], SERVOPWR: [IN]]
  - [SERVOPWR: [SERVO V+], W_SERVO: [1], SERVO: [V+]]
  - [SERVOPWR: [SERVO2 V+], W_SPWR: [3], SERVO2: [V+]]
  - [GNDPT: [SERVO2 GND], W_GND_SERVO2: [1], SERVO2: [GND]]
  - [ESP32: [GPIO 18 (throttle servo PWM)], W_SERVO: [2], SERVO: [SIGNAL]]
  - [ESP32: [GPIO 19 (clutch servo PWM)], W_SERVO2: [1], SERVO2: [SIGNAL]]
  # ---- START button sense and E-STOP sense (ESP32 uses INPUT_PULLUP, so a closed contact reads LOW) ----
  - [START: [SENSE A], W_START: [1], ESP32: [GPIO 20 (START button)]]
  - [START: [SENSE B], W_START: [2], ESP32: [GND]]
  # ---- engine start: battery + -> fuse -> relay NO4 (dies on E-stop) -> START button -> solenoid trigger. Release the button = crank stops ----
  # Manual limits: crank 5 s max, then wait 1 min. Nothing here enforces that (it is the operator's hand on the button).
  - [BATT: [+], W_BATT_FUSE: [1], START_FUSE: [IN]]
  - [START_FUSE: [OUT], W_START_GATE: [1], RELAYS: [NO4 A]]
  - [RELAYS: [NO4 B], W_START_SW: [1], START: [STARTER A]]
  - [START: [STARTER B], W_START_SOL: [1], STARTER_SOL: [TRIGGER]]
  - [BATT: [+], W_BATT_SOL: [1], STARTER_SOL: [BATT POS (big terminal)]]
  # Battery - to the engine mounting bolt (cranking current returns through the engine block, NOT through the star point).
  # The battery is only connected for starts. Its - goes ONLY to the engine block bolt, never to the star point.
  # The optional star tie below is a separate thin permanent wire to the same bolt; it carries no cranking current.
  - [BATT: [-], W_BATT_NEG: [1], ENGINE_BLK: [BATT -]]
  - [ESTOP: [SENSE A], W_ESTOP: [1], ESP32: [GPIO 21 (E-STOP sense)]]
  - [ESTOP: [SENSE B], W_ESTOP: [2], ESP32: [GND]]
  # ---- main computer ----
  - [COMPUTER: [USB-A 1], W_USB_ESP: [1], ESP32: [USB (power + serial)]]   # also powers the ESP32 (so no 5 V bus link). NOTE: ESP32 and T7 both ground to the computer via USB AND via the star = ground loop; if the pressure readings are noisy, put a USB isolator on the ESP32
  - [COMPUTER: [USB-A 2], W_USB_T7: [1], T7: [USB]]
  - [COMPUTER: [ETHERNET], W_ETH_T7: [1], T7: [ETHERNET]]
  # ---- 5 V supply monitor: bus -> 10k -> GPIO1 -> 10k -> GND, 100 nF at the pin (logged by the ESP32 over USB serial) ----
  - [BUS5V: [SUPPLY SENSE], W_DIV_TOP: [1], R_DIV1: [5V side]]
  - [R_DIV1: [mid side], W_DIV_MID: [1], ESP32: [GPIO 1 (5V sense ADC1)]]
  - [R_DIV2: [mid side], W_DIV_MID: [2], ESP32: [GPIO 1 (5V sense ADC1)]]
  - [C_ADC: [mid side], W_DIV_MID: [3], ESP32: [GPIO 1 (5V sense ADC1)]]
  - [R_DIV2: [GND side], W_DIV_GND: [1], ESP32: [GND]]
  - [C_ADC: [GND side], W_DIV_GND: [2], ESP32: [GND]]
  # ---- BMP280 ambient pressure + temperature, I2C to the ESP32-C6 (powered from the ESP32 3.3 V, read before the run) ----
  - [ESP32: [3V3], W_BMP: [1], BMP280: [VIN]]
  - [ESP32: [GND], W_BMP: [2], BMP280: [GND]]
  - [ESP32: [GPIO 6 (I2C SDA)], W_BMP: [3], BMP280: [SDI]]
  - [ESP32: [GPIO 7 (I2C SCL)], W_BMP: [4], BMP280: [SCK]]

  # ---- Bosch 32 mm electronic throttle body: 12 V motor through E-STOP, fuse and H-bridge; position sensors to the ESP32 ----
  - [PSU: [V2 +12V], W_12V_ESTOP: [1], RELAYS: [NO2 A]]
  - [RELAYS: [NO2 B], W_12V_FUSE: [1], TB_FUSE: [IN]]
  - [TB_FUSE: [OUT], W_12V_HB: [1], HBRIDGE: [B+]]
  - [GNDPT: [HBRIDGE GND], W_GND_HB: [1], HBRIDGE: [B-]]
  - [HBRIDGE: [M+], W_HB_MOT: [1], BOSCH_TB: [MOTOR+]]
  - [HBRIDGE: [M-], W_HB_MOT: [2], BOSCH_TB: [MOTOR-]]
  - [ESP32: [GPIO 22 (TB H-bridge IN1)], W_HB_CTRL: [1], HBRIDGE: [RPWM]]
  - [ESP32: [GPIO 23 (TB H-bridge IN2)], W_HB_CTRL: [2], HBRIDGE: [LPWM]]
  - [BUS5V: [HBRIDGE VCC], W_HB_VCC: [1], HBRIDGE: [VCC]]
  - [BUS5V: [HBRIDGE VCC], W_HB_EN: [1], HBRIDGE: [R_EN]]
  - [BUS5V: [HBRIDGE VCC], W_HB_EN: [2], HBRIDGE: [L_EN]]
  - [ESP32: [GND], W_HB_GND: [1], HBRIDGE: [GND]]   # logic ground reference for the PWM signals
  - [BUS5V: [BOSCH TB], W_TB_5V: [1], BOSCH_TB: [TPS +5V]]
  - [GNDPT: [SENS GND], W_TB_SGND: [1], BOSCH_TB: [SENSOR GND]]
  - [BOSCH_TB: [TPS1 OUT], W_TPS1_SIG: [1], R_TPS1A: [TPS side]]
  - [R_TPS1A: [mid side], W_TPS1_NODE: [1], ESP32: [GPIO 2 (TB TPS1 ADC1)]]
  - [R_TPS1B: [mid side], W_TPS1_NODE: [2], ESP32: [GPIO 2 (TB TPS1 ADC1)]]
  - [C_TPS1: [mid side], W_TPS1_NODE: [3], ESP32: [GPIO 2 (TB TPS1 ADC1)]]
  - [R_TPS1B: [GND side], W_TPS1_GND: [1], ESP32: [GND]]
  - [C_TPS1: [GND side], W_TPS1_GND: [2], ESP32: [GND]]
  - [BOSCH_TB: [TPS2 OUT], W_TPS2_SIG: [1], R_TPS2A: [TPS side]]
  - [R_TPS2A: [mid side], W_TPS2_NODE: [1], ESP32: [GPIO 3 (TB TPS2 ADC1)]]
  - [R_TPS2B: [mid side], W_TPS2_NODE: [2], ESP32: [GPIO 3 (TB TPS2 ADC1)]]
  - [C_TPS2: [mid side], W_TPS2_NODE: [3], ESP32: [GPIO 3 (TB TPS2 ADC1)]]
  - [R_TPS2B: [GND side], W_TPS2_GND: [1], ESP32: [GND]]
  - [C_TPS2: [GND side], W_TPS2_GND: [2], ESP32: [GND]]

  # ---- E-stop relay loop: 12 V -> key -> E-stop (NC) -> relay coil. Pressing the E-stop, turning the key off, or losing 12 V drops everything ----
  - [PSU: [V2 +12V], W_COIL_A: [1], KEY: [A]]
  - [KEY: [B], W_COIL_B: [1], ESTOP: [NC A]]
  - [ESTOP: [NC B], W_COIL_C: [1], RELAYS: [COIL+]]
  - [GNDPT: [RELAY COIL GND], W_COIL_GND: [1], RELAYS: [COIL-]]
  # ---- Predator (the prime mover): relay contact 3 (normally closed) grounds the kill lead when stopped ----
  - [PRED_KILL: [KILL LEAD], W_KILL: [1], RELAYS: [NC3 A]]
  - [RELAYS: [NC3 B], W_KILL: [2], ENGINE_BLK: [KILL RETURN]]   # direct to the block so the E-stop kills the engine with or without the battery
